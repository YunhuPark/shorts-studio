[project]
name = "shorts-studio"
version = "0.0.1"
description = "AI short-video studio: storyboard -> images -> voices -> rendered 9:16 short"
requires-python = ">=3.11"
dependencies = ["pillow", "numpy", "imageio-ffmpeg"]

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
vision = ["opencv-python-headless"]  # face-consistency check (YuNet detector + SFace recogniser)
dev = ["httpx", "ruff"]  # httpx: FastAPI TestClient; ruff: lint

[project.scripts]
shorts-studio = "shorts_studio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["prototype", ".data", "frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
